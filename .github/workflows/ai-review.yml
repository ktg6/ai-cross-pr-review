# Consumer repository側に置くmanual trigger専用のthin wrapper。
# 共通workflowは監査済みのfull commit SHAで固定し、Secretは明示的に渡す。
name: AI Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: レビュー対象のPR番号。
        required: true
        type: string

permissions: {}

concurrency:
  group: ai-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate request
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    outputs:
      pr_number: ${{ steps.validate.outputs.pr_number }}
    steps:
      - name: Reject non-default ref
        env:
          AI_REVIEW_REF: ${{ github.ref }}
          AI_REVIEW_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os

          ref = os.environ["AI_REVIEW_REF"]
          default_branch = os.environ["AI_REVIEW_DEFAULT_BRANCH"]
          if ref != f"refs/heads/{default_branch}":
              raise SystemExit("ai-review must run from the default branch")
          PY

      - name: Validate PR number
        id: validate
        env:
          AI_REVIEW_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import os
          import re

          value = os.environ["AI_REVIEW_PR_NUMBER"]
          if re.fullmatch(r"[1-9][0-9]{0,9}", value) is None:
              raise SystemExit("pr_number must be a positive integer")
          if int(value) > 2**31 - 1:
              raise SystemExit("pr_number is out of range")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"pr_number={value}", file=output)
          PY

  review:
    name: Run reusable AI review
    needs: validate
    permissions:
      contents: read
      pull-requests: write
    uses: ktg6/ai-cross-pr-review/.github/workflows/claude-review.yml@820ecc6eec5cdbe816f0cd8a5ce9dfec434a233d
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
